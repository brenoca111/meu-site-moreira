<!DOCTYPE html>
<lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página do Script Moreira</title>
    <!-- Inclui o Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Define a fonte Inter como padrão */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Fundo cinza claro */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Container principal e centralizado -->
    <div class="bg-white p-8 md:p-12 rounded-xl shadow-2xl max-w-lg w-full text-center">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6">
            Página Inicial
        </h1>
        
        <!-- Área de exibição da mensagem (oculta inicialmente) -->
        <div id="mensagem-area" class="mt-8 p-4 bg-yellow-100 border border-yellow-400 rounded-lg text-left hidden">
            <p class="text-yellow-800 font-semibold mb-2">Canal de Acesso:</p>
            <!-- Este texto é a versão segura e educativa. -->
            <pre class="bg-yellow-200 p-3 rounded-md overflow-x-auto text-sm text-yellow-900">
-- Código Seguro e de Exemplo
print("Bem-vindo ao conteúdo do Moreira!")
-- Para acessar seu conteúdo, use o link oficial do seu canal.
            </pre>
            <button id="copiar-btn" class="mt-3 w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 ease-in-out shadow-md">
                Copiar Texto de Exemplo
            </button>
        </div>

        <!-- Botão principal -->
        <button id="script-btn" 
                class="mt-6 w-full py-3 px-6 bg-indigo-600 text-white font-bold text-lg rounded-xl shadow-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
            Script Moreira
        </button>

        <!-- Mensagem de feedback (oculta inicialmente) -->
        <p id="feedback" class="mt-4 text-green-600 font-semibold hidden">Link copiado com sucesso!</p>
    </div>

    <script>
        // Função para manipular o clique no botão principal
        document.getElementById('script-btn').addEventListener('click', function() {
            const mensagemArea = document.getElementById('mensagem-area');
            // Torna a área de mensagem visível
            mensagemArea.classList.remove('hidden');
            
            // Rola suavemente para a área da mensagem
            mensagemArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // Função para copiar o texto de exemplo
        document.getElementById('copiar-btn').addEventListener('click', function() {
            const textToCopy = document.querySelector('#mensagem-area pre').textContent;
            const feedbackElement = document.getElementById('feedback');
            
            // Tenta copiar o texto para a área de transferência
            try {
                // Para ambientes com restrições (como iFrames), usamos document.execCommand
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy.trim();
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);

                // Mostra o feedback
                feedbackElement.textContent = 'Texto de exemplo copiado com sucesso!';
                feedbackElement.classList.remove('hidden', 'text-green-600');
                feedbackElement.classList.add('text-green-600');

                // Esconde o feedback após 3 segundos
                setTimeout(() => {
                    feedbackElement.classList.add('hidden');
                }, 3000);

            } catch (err) {
                // Caso a cópia falhe (improvável com execCommand)
                feedbackElement.textContent = 'Erro ao copiar o texto.';
                feedbackElement.classList.remove('hidden', 'text-green-600');
                feedbackElement.classList.add('text-red-600');
                setTimeout(() => {
                    feedbackElement.classList.add('hidden');
                }, 3000);
            }
        });
    </script>
</body>
</html>
